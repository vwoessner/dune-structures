# Run with structured2d_p2 via structured UGGrid
solver:
    vectors:
      - Displacement Field_0
      - Body Force_0
      - Traction Force_0
    grid:
      N:
        - 40
        - 10
      lowerleft:
        - 0
        - 0
      refinement: 0
      upperright:
        - 4
        - 1
      _blockname: grid_0
    blocks:
      - _type: material
        _blockname: material_0
        materials:
          -
            group: 0
            model: linear
            plane-stress-approx: false
            poisson_ratio: 0.3333
            youngs_modulus: 300
            prestress:
                type: isotropic
                scale: 0
      - _type: interpolation
        _blockname: interpolation_0
        functions: 0
        vector: 0
      - _type: interpolation
        _blockname: interpolation_1
        functions: 100, 0
        vector: 1
      - _type: constraints
        _blockname: constraints_0
        functions: x < 1e-8
        vector: 0
      - _type: linearsolver
        _blockname: linearsolver_0
        operator:
          reinforced_operator:
            _blockname: reinforced_operator_0
            enable_boundary: true # add bending terms at Dirichlet Boundary: hard-coded in eulerbernoulli.hh !!!
            verbose: true # show details on fiber cutting background mesh
            fibres:
              -
                end:
                  - 4.5
                  - 0.249
                radius: 0.05
                start:
                  - -0.5
                  - 0.249
                youngs_modulus: 1e4
                prestress: 0
              -
                end:
                  - 4.5
                  - 0.7501
                radius: 0.05
                start:
                  - -0.5
                  - 0.7501
                youngs_modulus: 1e4
                prestress: 0
            vector: 0
        vector: 0
      - _type: visualization
        _blockname: visualization_0
        blocks:
          - _type: vis_vector
            _blockname: vis_vector_0
            vector: 0
          - _type: vis_vonmises
            _blockname: vis_vonmises_0
            continuous: true
            vector: 0
          - _type: vis_stress
            _blockname: vis_stress_0
            vector: 0
          - _type: vis_stress
            _blockname: vis_stress_1
            vector: 0
            index: 0
        filename: fig_23_2_eb
        instationary: false
        intervals: 1
        path: vtk
